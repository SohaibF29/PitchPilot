[project]
name = "pitchpilot-backend"
version = "1.0.0"
description = "PitchPilot - AI Boardroom SaaS Platform Backend"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PitchPilot Team"}]

dependencies = [
    # Web Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-multipart>=0.0.9",

    # LangGraph & LangChain
    "langgraph>=1.0.10",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph-checkpoint-postgres>=3.0.1",

    # Database
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",

    # Supabase
    "supabase>=2.10.0",

    # Redis
    "upstash-redis>=1.1.0",
    "upstash-ratelimit>=1.1.0",

    # Observability
    "langfuse>=2.50.0",

    # PDF Generation
    "weasyprint>=62.0",
    "Jinja2>=3.1.4",

    # Security & Encryption
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.9.0",

    # Utilities
    "pydantic-settings>=2.5.0",
    "tenacity>=9.0.0",
    "circuitbreaker>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "locust>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
